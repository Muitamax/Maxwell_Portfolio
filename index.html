<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maxwell Muruthi | Terminal</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff99;
  font-family: "Fira Code", monospace;
  overflow: hidden;
}

/* MATRIX CANVAS */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

/* TERMINAL */
#terminal {
  position: relative;
  z-index: 1;
  padding: 40px;
  max-width: 900px;
  margin: auto;
  display: none;
}

.output {
  white-space: pre-wrap;
  margin-bottom: 15px;
}

.command-line {
  display: flex;
}

.prompt {
  margin-right: 5px;
}

input {
  background: none;
  border: none;
  color: #00ff99;
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  outline: none;
}

a { color: cyan; text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="terminal">
  <div class="output" id="output">
Welcome to Maxwell Muruthi's Portfolio  
Type "help" to begin.
  </div>

  <div class="command-line">
    <span class="prompt">maxwell@portfolio:~$</span>
    <input type="text" id="input" autofocus>
  </div>
</div>

<script>
/* MATRIX EFFECT */
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for(let x = 0; x < columns; x++)
  drops[x] = 1;

function draw() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#00ff99";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++) {
    const text = letters[Math.floor(Math.random() * letters.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975)
      drops[i] = 0;

    drops[i]++;
  }
}

let matrixInterval = setInterval(draw, 33);

/* BOOT SEQUENCE */
const bootText = [
"Booting MaxwellOS v3.0...",
"Initializing developer modules...",
"Loading projects...",
"Authenticating user...",
"Access granted ✔",
"Launching terminal..."
];

let bootIndex = 0;

function typeBoot() {
  if (bootIndex < bootText.length) {
    console.log(bootText[bootIndex]);
    bootIndex++;
    setTimeout(typeBoot, 600);
  } else {
    clearInterval(matrixInterval);
    canvas.style.display = "none";
    document.body.style.overflow = "auto";
    document.getElementById("terminal").style.display = "block";
  }
}

setTimeout(typeBoot, 2000);

/* TERMINAL LOGIC */
const input = document.getElementById("input");
const output = document.getElementById("output");

const commands = {
  help: `
Available commands:
about
projects
skills
contact
clear
`,
  about: `
Maxwell Muruthi
Software Developer | Problem Solver

Building scalable systems using:
Laravel | Node.js | React | AI APIs
`,
  skills: `
HTML | CSS | JavaScript | PHP
Laravel | Node.js | MySQL
MongoDB | Docker | Git
`,
  projects: `
Supermarket Registry System
Weather UI App
E-Commerce Platform
Auction Management System
`,
  contact: `
Email: muitamaxwell@gmail.com
LinkedIn: linkedin.com/in/maxwellmuruthi
GitHub: github.com/Muitamax
`
};

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const value = input.value.trim().toLowerCase();

    if (value === "clear") {
      output.textContent = "";
    } else if (commands[value]) {
      output.textContent += `\nmaxwell@portfolio:~$ ${value}\n`;
      output.textContent += commands[value];
    } else {
      output.textContent += `\nCommand not found: ${value}\n`;
    }

    input.value = "";
  }
});
</script>

</body>
</html>
